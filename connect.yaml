deployAs:
  - name: enabler
    applicationType: assets
  - name: processor
    applicationType: service
    endpoint: /
    # Connect only runs the lifecycle scripts it is told about here; without this block the
    # "Post-deployment setup" step is a no-op and the cart Type + denomination discounts never appear.
    scripts:
      postDeploy: npm install && npm run build && npm run connector:post-deploy
      preUndeploy: npm install && npm run build && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_PROJECT_KEY
          description: commercetools project key
          required: true
        - key: CTP_AUTH_URL
          description: commercetools Auth URL
          required: true
          default: https://auth.europe-west1.gcp.commercetools.com
        - key: CTP_API_URL
          description: commercetools API URL
          required: true
          default: https://api.europe-west1.gcp.commercetools.com
        - key: CTP_SESSION_URL
          description: Session API URL
          required: true
          default: https://session.europe-west1.gcp.commercetools.com
        - key: CTP_CLIENT_ID
          description: commercetools client ID with manage_orders (cart custom fields), manage_types & manage_cart_discounts (post-deploy provisioning), view_sessions, view_api_clients, manage_checkout_payment_intents & introspect_oauth_tokens scopes
          required: true
        - key: CTP_JWKS_URL
          description: JWKs url (example - https://mc-api.europe-west1.gcp.commercetools.com/.well-known/jwks.json)
          required: true
          default: https://mc-api.europe-west1.gcp.commercetools.com/.well-known/jwks.json
        - key: CTP_JWT_ISSUER
          description: JWT Issuer for jwt validation (example - https://mc-api.europe-west1.gcp.commercetools.com)
          required: true
          default: https://mc-api.europe-west1.gcp.commercetools.com   
        - key: LOYALTY_API_URL
          description: Base URL of the Pierce loyalty backend, owner of the points ledger
          required: true
        - key: LOYALTY_TIMEOUT_MS
          description: Timeout for calls to the loyalty backend, kept well under the widget's patience
          required: false
          default: "5000"
        - key: LOYALTY_CART_TYPE_KEY
          description: Key of the cart custom Type carrying the redemption fields (created or extended by post-deploy)
          required: false
          default: pierce-loyalty-cart
        - key: LOYALTY_REDEMPTION_ID_FIELD
          description: Name of the cart custom field carrying the redemption id; the loyalty backend must read the same name
          required: false
          default: loyaltyRedemptionId
        - key: LOYALTY_DENOMINATIONS_FIELD
          description: Name of the cart custom field carrying the discount denomination keys; the loyalty backend must read the same name
          required: false
          default: loyaltyRedemption
        - key: LOYALTY_DISCOUNT_KEY_PREFIX
          description: Key prefix of the 18 denomination CartDiscounts; the loyalty backend must use the same prefix
          required: false
          default: loyalty-
        - key: LOYALTY_DISCOUNT_CURRENCIES
          description: Comma-separated currencies the 18 denomination CartDiscounts carry a Money entry for
          required: false
          default: EUR
        - key: LOYALTY_DISCOUNT_SORT_ORDER_BASE
          description: Prefix of the denomination discounts' sortOrder (index appended); keep below every marketing promotion
          required: false
          default: "0.000001"
      securedConfiguration:
        - key: CTP_CLIENT_SECRET
          description: commercetools client secret
          required: true
        - key: LOYALTY_API_KEY
          description: Shared secret sent as the X-Api-Key header on every call to the loyalty backend
          required: true